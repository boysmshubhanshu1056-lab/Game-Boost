
name: PRISMATIC iOS Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build PRISMATIC
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS application
        run: |
          xcodebuild \
            -project PRISMATIC.xcodeproj \
            -scheme PRISMATIC \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload artifacts

          cp -R \
            build/Build/Products/Release-iphoneos/PRISMATIC.app \
            Payload/

          cd Payload
          /usr/bin/zip -r ../artifacts/Prismatic-unsigned.ipa PRISMATIC.app
          cd ..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRISMATIC-IPA
          path: artifacts/Prismatic-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
