
name: PRISMATIC iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build PRISMATIC IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build PRISMATIC
        run: |
          xcodebuild \
            -project PRISMATIC.xcodeproj \
            -scheme PRISMATIC \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify app executable
        run: |
          APP="build/Build/Products/Release-iphoneos/PRISMATIC.app"

          test -d "$APP"
          test -f "$APP/Info.plist"

          echo "Checking executable name..."
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")

          echo "Executable: $EXECUTABLE"

          test -n "$EXECUTABLE"
          test -f "$APP/$EXECUTABLE"

          echo "Checking bundle identifier..."
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"

      - name: Package IPA
        run: |
          mkdir -p Payload artifacts

          cp -R build/Build/Products/Release-iphoneos/PRISMATIC.app Payload/

          cd Payload
          zip -r ../artifacts/Prismatic-unsigned.ipa PRISMATIC.app
          cd ..

          unzip -l artifacts/Prismatic-unsigned.ipa

          unzip -l artifacts/Prismatic-unsigned.ipa | grep "Payload/PRISMATIC.app/Info.plist"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PRISMATIC-IPA
          path: artifacts/Prismatic-unsigned.ipa
          if-no-files-found: error
