
name: PRISMATIC iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build PRISMATIC IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build PRISMATIC
        run: |
          xcodebuild \
            -project PRISMATIC.xcodeproj \
            -scheme PRISMATIC \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA correctly
        run: |
          mkdir -p Payload artifacts

          cp -R build/Build/Products/Release-iphoneos/PRISMATIC.app Payload/

          zip -r artifacts/Prismatic-unsigned.ipa Payload

          echo "Checking IPA structure..."
          unzip -l artifacts/Prismatic-unsigned.ipa

          unzip -l artifacts/Prismatic-unsigned.ipa | grep "Payload/PRISMATIC.app/Info.plist"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PRISMATIC-IPA
          path: artifacts/Prismatic-unsigned.ipa
          if-no-files-found: error
