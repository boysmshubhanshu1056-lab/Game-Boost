
name: PRISMATIC

options:
  bundleIdPrefix: com.prismatic
  deploymentTarget:
    iOS: "16.0"

targets:
  PRISMATIC:
    type: application
    platform: iOS

    sources:
      - path: PRISMATIC

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prismatic.booster
        PRODUCT_NAME: PRISMATIC
        INFOPLIST_FILE: PRISMATIC/Info.plist
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
